<title>War of Kings Kartenwerkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@700;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&amp;display=swap">

<style>
/* Werkbank bei Nacht: Bibliothek links, Karte als Werkstück in der Mitte, Werkzeuge rechts. */
:root{
  --ink:#06080b; --night:#0b1220; --navy:#0f1b30; --navy-2:#16243d; --navy-3:#1e304f; --line:#2a3c5a;
  --silver:#c4ccd8; --mist:#8e9bb0; --dim:#647087; --gold:#d4a94c; --gold-2:#f0cd7a;
  --ok:#7fd1a0; --warn:#f0c062; --bad:#f07a68; --red:#c8392f; --blue:#2f8df5;
  --f-head:'Cinzel','Trajan Pro',Georgia,serif; --f-ui:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
.namerow{display:flex;gap:8px;align-items:stretch}.namerow input{flex:1;min-width:0}.namerow button{white-space:nowrap}
.namesugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}.namesugg .pick{padding:6px 10px;font-size:13.5px}
body{margin:0;background:var(--ink);color:var(--silver);font:15px/1.4 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--navy-2);border-radius:6px;padding:7px 12px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:var(--navy-3);border-color:#3e5680}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.gold{background:linear-gradient(180deg,#e2b75a,#b98a2c);border-color:#e2b75a;color:#1a1204;font-weight:700}
.gold:hover:not(:disabled){background:linear-gradient(180deg,#f0cd7a,#c99735)}
.ghost{background:transparent}
.danger{color:#ffb1a3}
input[type=text],input[type=number],input[type=search],select,textarea{background:#0a1322;border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical}
label{display:grid;gap:4px;font-size:13px;color:var(--mist)}
h1,h2,h3{margin:0;font-family:var(--f-head);font-weight:700;color:var(--parch,#e9e1cc);text-wrap:balance}
p{margin:0}
.muted{color:var(--mist)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.tnum{font-variant-numeric:tabular-nums}

/* Kopfzeile */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,#0d1627,#090f1b);border-bottom:1px solid #22324e}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:19px;letter-spacing:.06em;white-space:nowrap}
.brand h1 span{color:var(--gold)}
.brand small{color:var(--mist);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mist);white-space:nowrap}
.pill.ok{border-color:#2f6a4b;color:#a7e2c0}.pill.warn{border-color:#7d6229;color:#f3d28c}.pill.bad{border-color:#80392f;color:#ffb3a5}
.dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:1px}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--navy);border:1px solid #33496d;border-radius:8px;padding:6px;display:grid;gap:2px;box-shadow:0 12px 40px #000a;z-index:20}
.menu-list button{border:0;background:transparent;text-align:left;padding:8px 10px}
.menu-list button:hover{background:var(--navy-3)}

/* Arbeitsfläche */
.ws{display:grid;grid-template-columns:280px minmax(0,1fr) 380px;gap:0;min-height:calc(100% - 56px)}
.lib{border-right:1px solid #1c2a44;background:#080e19;display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 56px);position:sticky;top:56px}
.folders{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-bottom:1px solid #1c2a44}.fbtn{padding:4px 10px;border-radius:999px;font-size:12.5px;background:#0c1525;border:1px solid #24344f;color:#cfd6e4;cursor:pointer}.fbtn span{color:var(--mist,#8a96ab);font-size:11.5px;margin-left:2px}.fbtn.on{background:rgba(232,177,58,.18);border-color:#e8b13a;color:#ffe2a0}.fbtn.add{border-style:dashed}.fbtn.pick{margin-left:auto}.fbtn.pick.on{background:#e8b13a;color:#1b1306}
.fbtn.pool{border-color:#3b5a3a}.fbtn.pool.over{border-color:#e05a4a;color:#ffb3a8}.fbtn.pool.over span{color:#ffb3a8}.fchip.pool{grid-column:2/-1;justify-self:start;max-width:none;padding:1px 7px;border-radius:999px;border:1px solid #2f4a2c;color:#bfe3a8}.fchip.pool.pk{border-color:#3c3f74;color:#c3c4ff}
.pickbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 12px;background:rgba(232,177,58,.08);border-bottom:1px solid rgba(232,177,58,.35)}.pickbar b{font-size:13px;color:#ffe2a0;width:100%}.pickbar button{padding:5px 9px;font-size:12.5px}
.libitem.picking{grid-template-columns:22px 46px minmax(0,1fr) auto}.pickbox{width:20px;height:20px;border-radius:5px;border:2px solid #5a6a86;display:grid;place-items:center;font-weight:900;color:#1b1306}.libitem.picked{border-color:#e8b13a;background:rgba(232,177,58,.1)}.libitem.picked .pickbox{background:#e8b13a;border-color:#e8b13a}
.fchip{grid-column:-2/-1;justify-self:end;font-size:11px;color:#9fb2d0;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}.fpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.lib-head{padding:12px 12px 8px;display:grid;gap:8px;border-bottom:1px solid #1c2a44}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters select{padding:5px 6px;font-size:13px}
.lib-list{overflow:auto;padding:8px;display:grid;gap:6px;align-content:start}
.libitem{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px;border-radius:7px;border:1px solid transparent;background:#0c1525;text-align:left;width:100%}
.libitem.on{border-color:var(--gold);background:#121d33}
.libitem img,.libitem .ph{width:46px;height:69px;border-radius:3px;object-fit:cover;background:#121a2a;display:block}
.libitem b{display:block;color:#e8e1cf;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libitem small{display:block;color:var(--mist);font-size:12px;line-height:1.25}
.chip{font-size:11px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);white-space:nowrap}
.chip.draft{color:#f3d28c;border-color:#6f5626}.chip.rel{color:#a7e2c0;border-color:#2f6a4b}
.lib-foot{padding:8px 12px;border-top:1px solid #1c2a44;font-size:12px;color:var(--dim)}

.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));min-width:0;background:radial-gradient(90% 60% at 50% 30%,#13203a 0,#070b13 70%)}
.cardwrap{position:relative;width:min(100%,calc((100vh - 170px) * .6667),560px);aspect-ratio:2/3;max-width:100%}
.cardwrap canvas{width:100%;height:100%;display:block;border-radius:10px;box-shadow:0 18px 60px #000c,0 0 0 1px #2a3c5a;touch-action:none}
.cardwrap.pan canvas{cursor:grab}.cardwrap.pan.dragging canvas{cursor:grabbing}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:560px}
.stagebar input[type=range]{width:160px}
.hint{font-size:12px;color:var(--dim);text-align:center;max-width:520px}

.panel{border-left:1px solid #1c2a44;background:#0a111e;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px;min-width:0}
.sec{padding:14px 34px 14px 16px;border-bottom:1px solid #1a2741;display:grid;gap:10px}
.sec.focus{background:#101b30;box-shadow:inset 3px 0 0 var(--gold)}
.sec h3{font-size:14px;letter-spacing:.08em;color:var(--gold-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pick{display:grid;justify-items:center;gap:3px;padding:6px 4px;border-radius:7px;border:1px solid #22314d;background:#0d1729;font-size:11.5px;line-height:1.1;text-align:center;min-width:0}
.pick img{width:40px;height:40px;object-fit:contain}
.pick.on{border-color:var(--gold);background:#1a2640;color:#f3e7c6}
.pick .st{font-size:9.5px;color:var(--dim)}
.pick.none{color:var(--mist);align-content:center}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{padding:6px 10px;font-size:13px}
.sw.on{border-color:var(--gold);background:#1a2640;color:#f3e7c6}
.sw[class*=theme-]::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;border:1px solid #fff5}
.sw.theme-blau::before{background:#2f5fb0}.sw.theme-rot::before{background:#b3242a}.sw.theme-schwarz::before{background:#202227}.sw.theme-weiss::before{background:#e6e9ee}
.sw.shiny span{background:linear-gradient(180deg,#fff 0,var(--g1) 45%,var(--g2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:'EB Garamond',Georgia,serif;font-weight:700;font-size:16px}
.dots .dot{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #0a111e;box-shadow:0 0 0 1px #33496d}
.dots .dot.on{box-shadow:0 0 0 2px var(--gold-2)}
.fontsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fontset{display:grid;gap:2px;text-align:left;padding:8px 10px;background:linear-gradient(180deg,#e9dfc6,#d6c8a6);color:#2a1d10;border-color:#8a7650}
.fontset:hover:not(:disabled){background:linear-gradient(180deg,#f3ead3,#e0d3b2);border-color:#c9a25a}
.fontset.on{box-shadow:0 0 0 2px var(--gold-2);border-color:var(--gold)}
.fs-name{font-size:19px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-text{font-size:13px;color:#4a3b28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontroles{margin-top:8px;display:grid;gap:8px}
.fontroles summary{cursor:pointer;color:var(--mist);font-size:13px}
.fontroles label{margin-top:6px}
.namestyles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ns{padding:9px 4px;background:linear-gradient(180deg,#e9dfc6,#d3c4a0);border-color:#8a7650;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:14px}
.ns.on{box-shadow:0 0 0 2px var(--gold-2);border-color:var(--gold)}
.ns .metal{background:var(--m);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px var(--e)}
.ns .emboss{color:#2a1a0c;text-shadow:0 1px 0 #fff8}
.gemrow{display:grid;gap:5px}
.gemhead{display:flex;justify-content:space-between;font-size:12.5px}
.gems{display:flex;flex-wrap:wrap;gap:5px}
.gem{padding:3px;border-radius:50%;background:transparent;border:2px solid transparent;line-height:0}
.gem i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 -2px 4px #0008,0 0 0 1.5px #b9c2cf}
.gem.on{border-color:var(--gold-2);background:transparent}
.sw.theme{display:inline-flex;align-items:center;gap:7px}
.th{width:14px;height:14px;border-radius:3px;display:inline-block;box-shadow:0 0 0 1px #c4ccd8aa}
.th-blau{background:linear-gradient(135deg,#9aa6b8,#1f4c9a 60%,#0b1a3a)}.th-karmesin{background:linear-gradient(135deg,#a7a0a2,#a3152a 60%,#3a0610)}
.th-obsidian{background:linear-gradient(135deg,#9aa0a8,#24272c 60%,#08090b)}.th-elfenbein{background:linear-gradient(135deg,#fffaf0,#d9cfb8 60%,#7d7462)}
.th-smaragd{background:linear-gradient(135deg,#a8b5ad,#126b45 60%,#04281a)}.th-amethyst{background:linear-gradient(135deg,#b3a8bd,#5b2b96 60%,#1e0b38)}
.th-bernstein{background:linear-gradient(135deg,#c9b9a0,#a8661a 60%,#3d2205)}
.issues{display:grid;gap:5px}
.issue{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;font-size:13px;line-height:1.3;text-align:left;border:0;background:transparent;padding:3px 0;width:100%}
.issue i{width:10px;height:10px;border-radius:50%;margin-top:4px;display:block}
.issue.error i{background:var(--bad)}.issue.warn i{background:var(--warn)}.issue.info i{background:#6e8bbf}
.issue span{color:#d9d3c5}
.status-switch{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.status-switch button{border:0;border-radius:0;background:transparent;padding:8px}
.status-switch button.on.draft{background:#3a2f15;color:#f3d28c}.status-switch button.on.rel{background:#163628;color:#a7e2c0}
.drop{border:1px dashed #3a5174;border-radius:8px;padding:12px;text-align:center;color:var(--mist);font-size:13px;display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--gold);background:#121d33}
.gridpick{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:4px;justify-content:center}
.gridpick button{padding:0;font-size:18px;line-height:1;border-radius:6px;position:relative}
.gridpick button.on.atk{background:#5a1712;border-color:#e3261d;color:#fff}
.gridpick button.on.mov{background:#102f57;border-color:#2f8df5;color:#fff}
.gridpick button .n{position:absolute;right:3px;bottom:1px;font-size:10px;color:#fff}
.gridpick .hero{display:flex;align-items:center;justify-content:center}
.gridpick .hero::after{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
.dirblock{display:grid;gap:8px;padding:10px;border:1px solid #1e2c47;border-radius:8px;background:#0c1527}
.dirblock .t{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.dirblock .t.atk{color:#ff8f86}.dirblock .t.mov{color:#8cc0ff}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.inline label{display:flex;align-items:center;gap:6px;color:var(--silver)}
.inline input[type=number]{width:64px}
.giftslot{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px;border:1px solid #1e2c47;border-radius:8px;background:#0c1527}
.giftslot img,.giftslot .ph{width:46px;height:46px;object-fit:contain;border-radius:6px;background:#0a101c}
.giftslot b{color:#f1d58c;display:block}
.giftslot small{color:var(--mist);display:block;font-size:12px;line-height:1.3}
.giftslot .ops{display:flex;gap:4px}
.giftslot .ops button{padding:4px 7px;font-size:13px}

/* Dialoge */
.modalback{position:fixed;inset:0;z-index:40;background:#03050ad9;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(820px,100%);max-height:90vh;overflow:auto;background:var(--navy);border:1px solid #33496d;border-radius:12px;padding:20px;display:grid;gap:12px}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal h2{font-size:20px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.giftlist{display:grid;gap:6px}
.giftopt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:8px;width:100%}
.giftopt img,.giftopt .ph{width:44px;height:44px;object-fit:contain}
.giftopt b{color:#f1d58c}.giftopt small{display:block;color:var(--mist);font-size:12.5px;line-height:1.3}
.giftopt small.short,.giftslot small.short{color:#e7dcc0}
.giftslot details.full summary{cursor:pointer;color:var(--dim);font-size:11.5px}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ph{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:18px;border:1px dashed #33496d}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button.on{border-color:var(--gold);color:#f3e7c6;background:#1a2640}
.crestgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cresttile{display:grid;gap:6px;justify-items:center;padding:10px;border:1px solid #22314d;border-radius:8px;background:#0c1527;text-align:center}
.cresttile img,.cresttile .ph{width:72px;height:72px;object-fit:contain}
.cresttile b{font-size:13.5px;color:#eee4cb}
.cresttile .btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.cresttile .btns button{font-size:12px;padding:4px 8px}

/* Vorlage einrichten */
.layout{position:fixed;inset:0;z-index:30;background:#05080e;display:grid;grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}
.layout .lbar{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #22324e;background:#0b1322}
.layout .lbar h2{font-size:17px;margin-right:auto}
.layout .lside{overflow:auto;border-right:1px solid #1c2a44;padding:10px;display:grid;gap:4px;align-content:start}
.layout .lside button{text-align:left;padding:6px 9px;font-size:13px}
.layout .lside button.on{border-color:var(--gold);background:#1a2640}
.layout .lstage{display:flex;align-items:center;justify-content:center;padding:14px;min-width:0;min-height:0}
